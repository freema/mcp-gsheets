name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      # No NPM_TOKEN: the publish authenticates over GitHub OIDC, and npm
      # attaches the provenance attestation on its own.
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          REQUIRED=11.5.1
          if [ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm >= $REQUIRED required for trusted publishing, got $NPM_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:run
          npm run build

      # Both the tag push and a published release trigger this workflow
      - name: Check if version already published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view mcp-gsheets@${PACKAGE_VERSION} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${PACKAGE_VERSION} already published, skipping"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check.outputs.already_published != 'true'
        run: npm publish --access public
